databases:
  - name: trading-agent-db
    plan: basic-256mb

services:
  - type: web
    name: trading-agent-api
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.tools.run_migrations
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-agent-db
          property: connectionString
      - key: STATE_STORE
        value: db
      - key: DEPTH_MODE
        value: demo
      - key: OPENAI_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: SLACK_CHANNEL
        value: all-trading
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: IBKR_HOST
        sync: false
      - key: IBKR_PORT
        sync: false
      - key: IBKR_CLIENT_ID
        sync: false
      - key: IBKR_USERNAME
        sync: false
      - key: IBKR_TRADE_MODE
        sync: false
      - key: TS_CLIENT_ID
        sync: false
      - key: TS_CLIENT_SECRET
        sync: false
      - key: TS_REFRESH_TOKEN
        sync: false
      - key: WEBULL_MASTER_API_ENDPOINT
        sync: false
      - key: WEBULL_MASTER_EVENTS_ENDPOINT
        sync: false
      - key: WEBULL_MASTER_APP_KEY
        sync: false
      - key: WEBULL_MASTER_APP_SECRET
        sync: false
      - key: WEBULL_MASTER_ACCOUNT_ID
        sync: false
      - key: WEBULL_MASTER_ACCOUNT_EQUITY
        sync: false
      - key: WEBULL_PERSONAL_API_ENDPOINT
        sync: false
      - key: WEBULL_PERSONAL_APP_KEY
        sync: false
      - key: WEBULL_PERSONAL_APP_SECRET
        sync: false
      - key: WEBULL_PERSONAL_ACCOUNT_ID
        sync: false
      - key: WEBULL_PERSONAL_ACCOUNT_EQUITY
        sync: false
      - key: LEARNING_XGB_MIN_ROWS
        value: "20"
      - key: LEARNING_MANUAL_MATCH_WINDOW_MINUTES
        value: "30"
      - key: LEARNING_BEHAVIOR_WEIGHT
        value: "0.35"
      - key: LEARNING_OUTCOME_WEIGHT
        value: "0.50"
      - key: LEARNING_MANUAL_EDGE_WEIGHT
        value: "0.15"
      - key: LEARNING_PENALTY_WEIGHT
        value: "0.10"
      - key: LEARNING_SANDBOX_ENABLED
        value: "0"
      - key: LEARNING_SYNTHETIC_MAX_RATIO
        value: "3.0"
      - key: LEARNING_SYNTHETIC_SAMPLE_WEIGHT
        value: "0.15"
      - key: COWORK_OPERATOR_USERNAME
        sync: false
      - key: COWORK_OPERATOR_PASSWORD
        sync: false
      - key: COWORK_OPERATOR_API_TOKEN
        sync: false

  - type: worker
    name: trading-agent-worker
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.tools.run_migrations
    startCommand: python -m app.workers.runner
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-agent-db
          property: connectionString
      - key: STATE_STORE
        value: db
      - key: DEPTH_MODE
        value: demo
      - key: POLYGON_API_KEY
        sync: false
      - key: SLACK_CHANNEL
        value: all-trading
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: IBKR_HOST
        sync: false
      - key: IBKR_PORT
        sync: false
      - key: IBKR_CLIENT_ID
        sync: false
      - key: IBKR_USERNAME
        sync: false
      - key: IBKR_TRADE_MODE
        sync: false
      - key: TS_CLIENT_ID
        sync: false
      - key: TS_CLIENT_SECRET
        sync: false
      - key: TS_REFRESH_TOKEN
        sync: false
      - key: WEBULL_MASTER_API_ENDPOINT
        sync: false
      - key: WEBULL_MASTER_EVENTS_ENDPOINT
        sync: false
      - key: WEBULL_MASTER_APP_KEY
        sync: false
      - key: WEBULL_MASTER_APP_SECRET
        sync: false
      - key: WEBULL_MASTER_ACCOUNT_ID
        sync: false
      - key: WEBULL_MASTER_ACCOUNT_EQUITY
        sync: false
      - key: WEBULL_PERSONAL_API_ENDPOINT
        sync: false
      - key: WEBULL_PERSONAL_APP_KEY
        sync: false
      - key: WEBULL_PERSONAL_APP_SECRET
        sync: false
      - key: WEBULL_PERSONAL_ACCOUNT_ID
        sync: false
      - key: WEBULL_PERSONAL_ACCOUNT_EQUITY
        sync: false
      - key: LEARNING_XGB_MIN_ROWS
        value: "20"
      - key: LEARNING_MANUAL_MATCH_WINDOW_MINUTES
        value: "30"
      - key: LEARNING_BEHAVIOR_WEIGHT
        value: "0.35"
      - key: LEARNING_OUTCOME_WEIGHT
        value: "0.50"
      - key: LEARNING_MANUAL_EDGE_WEIGHT
        value: "0.15"
      - key: LEARNING_PENALTY_WEIGHT
        value: "0.10"
      - key: LEARNING_SANDBOX_ENABLED
        value: "0"
      - key: LEARNING_SYNTHETIC_MAX_RATIO
        value: "3.0"
      - key: LEARNING_SYNTHETIC_SAMPLE_WEIGHT
        value: "0.15"
