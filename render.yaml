databases:
  - name: trading-agent-db
    plan: basic-256mb

services:
  - type: web
    name: trading-agent-api
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.tools.run_migrations
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-agent-db
          property: connectionString
      - key: STATE_STORE
        value: db
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DEPTH_MODE
        value: demo
      - key: COPIER_ENABLED
        value: "0"
      - key: COPIER_MODE
        value: test
      - key: COPIER_GLOBAL_KILL_SWITCH
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AI_FEATURES_ENABLED
        value: "0"
      - key: OPENAI_RESEARCH_ENABLED
        value: "0"
      - key: OPENAI_DAILY_REQUEST_LIMIT
        value: "200"
      - key: OPENAI_RESEARCH_DAILY_REQUEST_LIMIT
        value: "30"
      - key: OPENAI_SCOUT_EXPLANATION_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_DAILY_RECAP_MODEL
        value: gpt-5.4
      - key: OPENAI_LEARNING_TRANSLATION_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_TRADE_JOURNAL_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_RESEARCH_MODEL
        value: gpt-5.5
      - key: POLYGON_API_KEY
        sync: false
      - key: SLACK_CHANNEL
        value: all-trading
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: TS_CLIENT_ID
        sync: false
      - key: TS_CLIENT_SECRET
        sync: false
      - key: TS_REFRESH_TOKEN
        sync: false
      - key: WEBULL_MASTER_API_ENDPOINT
        sync: false
      - key: WEBULL_MASTER_EVENTS_ENDPOINT
        sync: false
      - key: WEBULL_MASTER_APP_KEY
        sync: false
      - key: WEBULL_MASTER_APP_SECRET
        sync: false
      - key: WEBULL_MASTER_ACCOUNT_ID
        sync: false
      - key: WEBULL_PERSONAL_API_ENDPOINT
        sync: false
      - key: WEBULL_PERSONAL_APP_KEY
        sync: false
      - key: WEBULL_PERSONAL_APP_SECRET
        sync: false
      - key: WEBULL_PERSONAL_ACCOUNT_ID
        sync: false
      - key: WEBULL_PERSONAL_DISPLAY_NAME
        value: Austin Dugger's Account
      - key: LEARNING_XGB_MIN_ROWS
        value: "20"
      - key: LEARNING_MANUAL_MATCH_WINDOW_MINUTES
        value: "30"
      - key: LEARNING_MATCH_PRE_ALERT_SECONDS
        value: "60"
      - key: LEARNING_MATCH_MIN_CONFIDENCE
        value: likely
      - key: LEARNING_BEHAVIOR_WEIGHT
        value: "0.35"
      - key: LEARNING_OUTCOME_WEIGHT
        value: "0.50"
      - key: LEARNING_MANUAL_EDGE_WEIGHT
        value: "0.15"
      - key: LEARNING_PENALTY_WEIGHT
        value: "0.10"
      - key: LEARNING_SANDBOX_ENABLED
        value: "0"
      - key: LEARNING_SYNTHETIC_MAX_RATIO
        value: "3.0"
      - key: LEARNING_SYNTHETIC_SAMPLE_WEIGHT
        value: "0.15"
      - key: LEARNING_PAPER_SAMPLE_WEIGHT
        value: "0.25"
      - key: TRADE_MATCH_WINDOW_SECONDS
        value: "1800"
      - key: TRADE_MATCH_PRE_ALERT_SECONDS
        value: "60"
      - key: TRADE_MATCH_MIN_CONFIDENCE
        value: likely
      - key: SHADOW_TRADER_ENABLED
        value: "1"
      - key: SHADOW_TRADER_MIN_P2R
        value: "0.70"
      - key: SHADOW_TRADER_MIN_RR
        value: "2.00"
      - key: SHADOW_TRADER_SIZE_PCT
        value: "0.05"
      - key: PAPER_TRADER_ENABLED
        value: "1"
      - key: PAPER_TRADER_ACCOUNT_EQUITY
        value: "10000"
      - key: PAPER_TRADER_SIZE_PCT
        value: "0.05"
      - key: PAPER_PROMOTION_MIN_CLOSED_TRADES
        value: "50"
      - key: PAPER_PROMOTION_MIN_TRADING_DAYS
        value: "3"
      - key: PAPER_PROMOTION_MIN_WIN_RATE
        value: "0.55"
      - key: PAPER_PROMOTION_MIN_AVG_R
        value: "0.20"
      - key: PAPER_PROMOTION_MAX_DRAWDOWN_PCT
        value: "0.10"
      - key: COWORK_OPERATOR_USERNAME
        sync: false
      - key: COWORK_OPERATOR_PASSWORD
        sync: false
      - key: COWORK_OPERATOR_API_TOKEN
        sync: false

