        fromDatabase:
          name: trading-agent-db
          property: connectionString
      - key: STATE_STORE
        value: db
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DEPTH_MODE
        value: demo
      - key: COPIER_ENABLED
        value: "0"
