<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MooneyCapitol Login</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --panel: #ffffff;
        --line: #dbe3ef;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --danger: #dc2626;
        --danger-bg: #fee2e2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 28px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      form { display: grid; gap: 14px; }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px 12px;
        color: var(--text);
        font: inherit;
      }
      input:focus {
        outline: 2px solid rgba(37, 99, 235, 0.2);
        border-color: var(--accent);
      }
      button {
        margin-top: 4px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: white;
        padding: 11px 14px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      button:hover { background: var(--accent-dark); }
      .error {
        margin: 0 0 14px;
        border: 1px solid #fecaca;
        border-radius: 8px;
        background: var(--danger-bg);
        color: var(--danger);
        padding: 10px 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MooneyCapitol</h1>
      <p>Sign in to open the operator dashboard.</p>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <label>
          Username
          <input name="username" autocomplete="username" autofocus required />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
